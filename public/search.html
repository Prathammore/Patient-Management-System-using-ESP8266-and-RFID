<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Patient - Hospital System</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #ECF0F1;
      color: #2C3E50;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header, footer {
      background-color: #2C3E50;
      color: white;
      padding: 15px;
      text-align: center;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
    }

    input[type="text"] {
      padding: 10px;
      font-size: 16px;
      width: 70%;
      max-width: 400px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #1ABC9C;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #16a085;
    }

    #results {
      margin-top: 20px;
    }

    .patient-item {
      background-color: #fefefe;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .patient-item b {
      color: #333;
    }

    .patient-item button {
      background-color: #e74c3c;
      margin-top: 10px;
    }

    .patient-item button:hover {
      background-color: #c0392b;
    }

    .no-results {
      background-color: #ffefef;
      padding: 15px;
      border: 1px solid #e0b4b4;
      border-radius: 8px;
      color: #c0392b;
    }
  </style>
</head>
<body>

<header>
  <h1>Search Patient</h1>
  <a href="home.html">
    <button>Go Back To Home Page</button>
  </a>
</header>

<main>
  <div class="card">
    <h2>🔍 Find Patient by Name or UID</h2>
    <input type="text" id="searchBox" placeholder="Enter name or UID">
    <button onclick="searchPatient()">Search</button>

    <div id="results"></div>
  </div>
</main>

<footer>
  &copy; 2025 Smart Patient Management
</footer>

<script>
  async function searchPatient() {
    const query = document.getElementById("searchBox").value.trim();
    if (!query) {
      alert("Please enter a name or UID to search.");
      return;
    }

    const res = await fetch(`/search?query=${encodeURIComponent(query)}`);
    try {
      const data = await res.json();
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      if (!Array.isArray(data) || data.length === 0) {
        resultsDiv.innerHTML = `<div class="no-results">No patients found for "${query}".</div>`;
        return;
      }

      data.forEach(p => {
        const el = document.createElement("div");
        el.classList.add("patient-item");
        el.innerHTML = `
          <b>Name:</b> ${p.name}<br>
          <b>UID:</b> ${p.uid}<br>
          <b>Age:</b> ${p.age}<br>
          <b>Gender:</b> ${p.gender}<br>
          <b>Disease:</b> ${p.disease}<br>
          <b>Registered At:</b> ${new Date(p.createdAt).toLocaleString()}<br>
          <b>Last Entry:</b> ${new Date(p.entryAt).toLocaleString()}<br>
          <button onclick="deletePatient('${p.uid}')"> Delete</button>
        `;
        resultsDiv.appendChild(el);
      });
    } catch (err) {
      console.error("Error parsing response:", err);
      alert("There was a problem fetching the patient data.");
    }
  }

  async function deletePatient(uid) {
    const confirmDelete = confirm(`Are you sure you want to delete UID: ${uid}?`);
    if (!confirmDelete) return;

    const res = await fetch(`/delete?uid=${uid}`, { method: "DELETE" });
    const data = await res.text();
    alert(data);
    searchPatient(); // refresh list
  }
</script>

</body>
</html>
